<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Новая крыша — первый экран, мобильная версия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Jost:wght@400;500&display=swap&subset=cyrillic" rel="stylesheet">
<style>
  :root {
    --accent: #c4873f;
    --bg: #f7f7f8;
    --text: #1b1b1d;
    --text-2: #4a4a4f;
    --display: "Tenor Sans", sans-serif;
    --font: "Jost", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { width: 375px; margin: 0; overflow-x: hidden; }
  body { background: var(--bg); color: var(--text); font: 400 16px/24px var(--font); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  h1, h2, h3, p { margin: 0; }

  .header { display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 20px; }
  .logo { display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 20px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; }
  .logo i { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 16px; background: var(--accent); color: #fff; }
  .right { display: flex; gap: 16px; align-items: center; color: var(--accent); }

  .hero { position: relative; overflow: hidden; padding: 24px 20px 0; }
  .geo { font-size: 15px; line-height: 22px; }
  h1 { margin-top: 8px; font: 400 32px/38px var(--display); text-transform: uppercase; }
  h1 .l1 { display: block; color: var(--accent); }
  .lead { margin-top: 16px; font-size: 16px; line-height: 24px; color: var(--text-2); }
  .btn { display: flex; align-items: center; justify-content: center; height: 56px; margin-top: 24px; border-radius: 28px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; }
  .credit { display: block; margin-top: 16px; text-align: center; font-size: 15px; line-height: 22px; }
  .credit b { font-weight: 500; color: var(--accent); }
  .credit span { color: var(--text-2); }
  .roofs { position: absolute; left: -330px; bottom: 0; width: 720px; height: 240px; }
  .space { height: 260px; }
</style>
</head>
<body>
  <header class="header">
    <a class="logo" href="#"><i><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12 12 4l9 8"/><path d="M6 10v10h12V10"/></svg></i>Новая крыша</a>
    <div class="right">
      <a href="#" aria-label="Позвонить"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></a>
      <a href="#" aria-label="Меню" style="color: var(--text)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h16M4 16h16"/></svg></a>
    </div>
  </header>

  <section class="hero">
    <p class="geo">Материалы и монтаж — в одном договоре</p>
    <h1><span class="l1">Кровля из металло&shy;черепицы</span>— под ключ по всей Беларуси</h1>
    <p class="lead">Все необходимые материалы и профессиональный монтаж — от замера до готовой кровли.</p>
    <a class="btn" href="#">Рассчитать стоимость</a>
    <a class="credit" href="#"><b>Кредит до 84 месяцев</b> <span>— оформим на замере, без справок</span></a>
    <div class="space"></div>
    <img class="roofs" src="assets/roofs.webp" alt="Дома с кровлей из металлочерепицы">
  </section>
</body>
</html>
