<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Новая крыша — первый экран, мобильная версия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;700&family=Inter:wght@400;500;600&display=swap&subset=cyrillic" rel="stylesheet">
<style>
  :root {
    --green: #3a4f45;
    --green-2: #4d6358;
    --green-3: #2f4139;
    --page: #f4f4f4;
    --card: #e9ebe7;
    --text: #1d221f;
    --text-2: #5d655f;
    --on-dark-2: rgba(255, 255, 255, .82);
    --display: "Inter Tight", sans-serif;
    --font: "Inter", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { width: 375px; margin: 0; overflow-x: hidden; }
  body { background: var(--page); color: var(--text); font: 400 16px/24px var(--font); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  h1, h2, h3, p { margin: 0; }

  .stage { position: relative; height: 680px; margin: 8px 8px 0; border-radius: 24px; overflow: hidden;
    background: url(assets/hero.jpg) 38% top / auto 760px no-repeat; }
  .stage::before { content: ""; position: absolute; inset: 0;
    background: linear-gradient(0deg, rgba(14, 20, 17, .86) 0%, rgba(14, 20, 17, .55) 36%, rgba(14, 20, 17, 0) 60%); }
  .header { position: absolute; z-index: 2; top: 8px; left: 8px; right: 8px; display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; flex-direction: column; justify-content: center; height: 48px; padding: 0 18px; border-radius: 24px; background: var(--green); color: #fff; }
  .logo b { font: 700 16px/18px var(--display); letter-spacing: -.02em; }
  .logo span { font-size: 7px; line-height: 10px; letter-spacing: .3em; text-transform: uppercase; opacity: .8; }
  .right { display: flex; gap: 6px; padding: 4px; border-radius: 24px; background: var(--green); color: #fff; }
  .right a { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 20px; background: var(--green-3); }

  .offer { position: absolute; z-index: 2; left: 16px; right: 16px; bottom: 24px; color: #fff; }
  h1 { font: 700 34px/36px var(--display); letter-spacing: -.045em; }
  .lead { margin-top: 16px; color: var(--on-dark-2); font-size: 15px; line-height: 22px; }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 8px 0; }
  .card { position: relative; height: 196px; padding: 18px; border-radius: 22px; }
  .card h3 { font: 600 17px/21px var(--font); letter-spacing: -.01em; }
  .card p { margin-top: 8px; font-size: 13px; line-height: 17px; }
  .card--calc { background: var(--green); color: #fff; }
  .card--calc p { color: var(--on-dark-2); }
  .card--credit { background: var(--card); }
  .card--credit p { color: var(--text-2); }
  .go { position: absolute; left: 18px; bottom: 16px; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 18px; }
  .card--calc .go { background: rgba(255, 255, 255, .16); }
  .card--credit .go { background: #fff; }
  .big { position: absolute; right: 14px; bottom: 10px; font: 700 40px/40px var(--display); letter-spacing: -.05em; color: var(--green); }
  .big span { font-size: 13px; letter-spacing: 0; }
  .phone { display: flex; align-items: center; justify-content: center; height: 56px; margin: 8px 8px 24px; border-radius: 28px; background: var(--green-2); color: #fff; font-size: 16px; font-weight: 500; }
</style>
</head>
<body>
  <section class="stage">
    <header class="header">
      <a class="logo" href="#"><b>Новая крыша</b><span>кровля под ключ</span></a>
      <div class="right">
        <a href="#" aria-label="Позвонить"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></a>
        <a href="#" aria-label="Меню"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></a>
      </div>
    </header>
    <div class="offer">
      <h1>Кровля из металлочерепицы под ключ по всей Беларуси</h1>
      <p class="lead">Все необходимые материалы и профессиональный монтаж — от замера до готовой кровли.</p>
    </div>
  </section>

  <div class="cards">
    <a class="card card--calc" href="#">
      <h3>Рассчитать стоимость кровли</h3>
      <p>Нужен только ваш номер</p>
      <span class="go"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></span>
    </a>
    <a class="card card--credit" href="#">
      <h3>Кровля в кредит</h3>
      <p>На замере, без справок</p>
      <span class="go"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></span>
      <span class="big">84<span> мес.</span></span>
    </a>
  </div>
  <a class="phone" href="#">+375 29 000-00-00</a>
</body>
</html>
